# All model IDs and thresholds are configuration, not embedded in the pipeline.
# Tested on Linux / Python 3.12 / CPU. Native decoded BGR8 pixels are the baseline.
[run]
count = 20
max_attempts = 3
threads = 2
previews = true

[video]
candidates = 0 # 0: duration-aware, at least 3 x output count, at most max_candidates
max_candidates = 96
sample_seconds = 0.5
max_scan_samples = 600
scene_threshold = 27.0
min_scene_seconds = 0.6
analysis_size = 640
neighbors = 2
max_cache_mb = 1536
max_input_mb = 2048
max_duration_seconds = 7200
max_pixels = 16777216
download_timeout_seconds = 45
download_total_seconds = 600

[selection]
min_sharpness = 8.0
max_dark_fraction = 0.85
max_bright_fraction = 0.85
min_gray_std = 8.0
phash_distance = 5

[ocr]
backend = "rapidocr"
mode = "auto"
confidence = 0.55
max_side = 1600
threads = 2
bottom_start = 0.60
min_line_width = 0.12
auto_allow_bottom = false
keep_words = []
protect_regions = [] # pixel rectangles [x0,y0,x1,y1]
manual_regions = [] # rectangles or polygons; see README

[mask]
type = "fine"
contrast_threshold = 22
dilate_px = 2
shadow_px = 3
max_padding = 12
min_stroke_coverage = 0.015
max_area_fraction = 0.20
feather_px = 2

[qc]
min_sharpness = 6.0
min_sharpness_ratio = 0.55
max_mask_fraction = 0.20
max_seam_excess = 60.0
residual_overlap = 0.08
max_persistent_stroke_pixels = 16
require_no_uncertain_text = true

[gemini]
mock = false
api_key_env = "GEMINI_API_KEY"
image_model = "gemini-nano-banana-2.1"
max_calls = 40
max_cost_usd = 2.0
timeout_seconds = 90
max_retries = 0
calls_per_minute = 10
image_thinking_level = "minimal"
image_size = "1K" # Smallest Nano Banana 2.1 output; edits are composited at source resolution.
reserve_image_usd = 0.30

[gemini.prices."gemini-nano-banana-2.1"]
input_per_million = 1.50
output_per_million = 7.50
image_output_per_million = 30.00

# Shared local reservations across output folders. Google quotas apply to the
# provider project and can also be consumed by other clients.
[gemini.quota."gemini-nano-banana-2.1"]
rpm = 10
tpm = 160000
rpd = 800

[gemini.quota.fallback]
rpm = 5
tpm = 80000
rpd = 200
